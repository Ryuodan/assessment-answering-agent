                # ---- assessment-answer (FastAPI) on 127.0.0.1:8093 ----
                location = /assessment { return 301 /assessment/; }

                location /assessment/ {
                        # Trailing slash: /assessment/api/x -> /api/x upstream
                        proxy_pass http://127.0.0.1:8093/;

                        proxy_http_version 1.1;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_set_header X-Forwarded-Prefix /assessment;

                        # The bundled UI calls absolute /api/... paths. Rewrite them
                        # into the prefix, same trick the /arabic-tts/ block uses.
                        # Accept-Encoding must be cleared or sub_filter sees gzip.
                        proxy_set_header Accept-Encoding "";
                        sub_filter_once off;
                        sub_filter_types text/html application/javascript text/javascript;
                        sub_filter "/api/" "/assessment/api/";

                        proxy_buffering off;
                        client_max_body_size 100M;

                        # Answering a long assessment is minutes, not seconds.
                        proxy_connect_timeout 300s;
                        proxy_send_timeout    900s;
                        proxy_read_timeout    900s;
                        send_timeout          900s;
                        client_body_timeout   900s;
                }
