[project]
name = "assessment-answer"
version = "0.1.0"
description = "Agentic assistant that fills in assessments from guidelines and previously answered assessments (English + Arabic)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain>=1.1.0,<2.0.0",
    "langchain-core>=1.2.0,<2.0.0",
    "langchain-groq>=1.0.0,<2.0.0",
    "langchain-openai>=1.1.0,<2.0.0",
    "langchain-chroma>=1.0.0,<2.0.0",
    "langchain-text-splitters>=1.0.0,<2.0.0",
    # Tracing. Arrives with langchain anyway, but this codebase imports it
    # directly (config.configure_tracing, and the tracing tests), so it is a
    # dependency of ours rather than something we happen to get for free.
    "langsmith>=0.4.0",
    "langgraph>=1.0.5,<2.0.0",
    "chromadb>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # Unicode bidirectional algorithm (UAX #9), used to recover logical
    # order from Arabic PDFs whose text layer is stored visually.
    "python-bidi>=0.6",
    # Local BGE-M3 embeddings; see src/embeddings.py.
    "langchain-huggingface>=1.2",
    "sentence-transformers>=5.0",
    # BM25 for the optional lexical retrieval pass; see src/lexical.py.
    "rank-bm25>=0.2.2",
    # PDF export of answered assessments, Arabic shaped correctly.
    "reportlab>=4.0",
    "arabic-reshaper>=3.0",
]

[dependency-groups]
# Development tools. A uv dependency group rather than an extra, so `uv sync`
# and `uv run` install them without a flag. `uv run poe check` is the gate.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff",
    "mypy>=1.15",
    "poethepoet>=0.34",
]

[project.optional-dependencies]
# Only needed to regenerate the bundled trial corpus (`python -m demo_data.generate`).
# reportlab and arabic-reshaper are core dependencies — the PDF export uses them.
demo = []
# Only needed to turn an evaluation run into a spreadsheet
# (`python -m scripts.eval_to_xlsx`). The application never writes a workbook
# from scratch: filling a questionnaire edits the customer's own file through
# src/forms/xlsx.py with the stdlib, so that its formatting survives.
reports = ["openpyxl>=3.1"]
# Local tracing. Sends OpenTelemetry spans to a Phoenix collector running on
# this machine -- see "Watching it work" in the README. The collector and its
# UI are a separate install (`pip install arize-phoenix`, or the docker image),
# deliberately: it is a server with its own database, and it does not belong in
# the dependency set of the application it watches.
phoenix = [
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-langchain>=0.1.29",
]

[project.scripts]
assessment-answer = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests are excluded by default; `pytest -m live_ai` overrides this.
addopts = "-ra -m 'not live_ai'"
asyncio_mode = "auto"
markers = [
    "live_ai: opt-in tests that call Groq or the embedding endpoint",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
# Python only. Ruff also formats code blocks inside Markdown, which strips the
# column-aligned comments the README's examples rely on.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F401", "F841"]

[tool.mypy]
# Strict, over the application and the harness. Errors that predate plan 001
# live in harness/mypy-baseline.txt and may only shrink; see harness/typecheck.py.
python_version = "3.11"
files = ["src", "harness"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Installed, but they ship no type information and typeshed has no stubs we
# use: treated as Any rather than recorded as baseline errors.
module = ["arabic_reshaper", "bidi.*", "rank_bm25", "reportlab.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Tasks. `uv run poe check` is the definition of done: it runs the gate tasks
# below in order and fails if any of them fails. See CLAUDE.md.
# ---------------------------------------------------------------------------
[tool.poe]
# Every task runs inside this checkout's .venv, however poe was started.
executor = { type = "virtualenv", location = ".venv" }

# Tools are always run as `python -m <tool>`, never through their .exe
# launchers: a launcher hard-codes the interpreter it was installed with, and
# this .venv was once copied from another checkout whose launchers still ran
# that checkout's interpreter (plan 001, progress log 2026-10-05).
# tests/harness/test_tasks.py holds this rule.
[tool.poe.tasks]
check = { cmd = "python -m harness.check", help = "The gate: every task below, in order; fails if any fails" }
fmt = { cmd = "python -m ruff format --check .", help = "Formatting is ruff's (fix: uv run poe format)" }
format = { cmd = "python -m ruff format .", help = "Apply ruff formatting" }
lint = { cmd = "python -m ruff check .", help = "Lint with ruff" }
types = { cmd = "python -m harness.typecheck", help = "mypy --strict against harness/mypy-baseline.txt" }
types-baseline = { cmd = "python -m harness.typecheck --shrink", help = "Drop fixed errors from the mypy baseline" }
test = { cmd = "python -m pytest -q", help = "Offline test suite (live_ai tests excluded)" }
